name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install editable package
        run: python -m pip install -e .

      - name: Check CLI entry point
        run: folder-report --help

      - name: Run folder-report tests
        # Avoid Windows short user-profile paths (RUNNER~1) in test fixtures.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -m unittest discover -s tests -v

      - name: Run JSON Inspector tests
        run: python -m unittest discover -s json-inspector/tests -v

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify isolated wheel installation
        run: python scripts/verify_wheel.py

      - name: Build JSON Inspector wheel
        run: python -m pip wheel ./json-inspector --no-deps --wheel-dir dist/json-inspector

      - name: Install JSON Inspector wheel
        shell: bash
        run: python -m pip install --no-index --no-deps dist/json-inspector/json_inspector-*.whl

      - name: Verify JSON Inspector CLI entry point
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          json-inspector --help
          json-inspector --version
