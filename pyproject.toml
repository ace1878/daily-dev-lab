[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-dev-lab"
version = "0.1.0"
description = "A command-line tool for reporting folder file counts and sizes"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
folder-report = "folder_report:main"

[tool.setuptools]
py-modules = ["folder_report"]
